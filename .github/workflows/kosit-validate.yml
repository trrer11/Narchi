# ---------------------------------------------------------------------------
# §128 — Job CI hébergé : validation XRechnung contre le validateur OFFICIEL
# KoSIT, à chaque changement du service de facturation.
#
# HONNÊTETÉ (règle de la maison, §123/§124) :
#   * Le script invoqué (scripts/valider-xrechnung-kosit.sh) est PROUVÉ en
#     local (rejoué le 16/08/2026, exit 0 en ~12 s, « Validation successful! »,
#     Acceptable: 2 / Rejected: 0) avec les SEULES dépendances : pytest +
#     JRE 11+ + curl/unzip/sha256sum (le service app/services/xrechnung.py
#     est en stdlib pur, et test_xrechnung.py n'importe que pytest).
#   * Ce workflow N'A ENCORE JAMAIS été exécuté depuis GitHub Actions : le
#     sandbox ne peut pas déclencher une pipeline distante. Le jalon
#     « validation automatique à chaque version » reste DONC non promis
#     jusqu'au premier run réel chez le client / sur le dépôt hébergé.
# ---------------------------------------------------------------------------
name: KoSIT XRechnung validation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/xrechnung.py"
      - "backend/tests/test_xrechnung.py"
      - "backend/tests/fixtures/xrechnung_kosit/**"
      - "scripts/valider-xrechnung-kosit.sh"
      - ".github/workflows/kosit-validate.yml"
  pull_request:
    paths:
      - "backend/app/services/xrechnung.py"
      - "backend/tests/test_xrechnung.py"
      - "backend/tests/fixtures/xrechnung_kosit/**"
      - "scripts/valider-xrechnung-kosit.sh"
      - ".github/workflows/kosit-validate.yml"
  # Lancement manuel (onglet Actions → Run workflow) sans toucher au code.
  workflow_dispatch:
  # Filet hebdomadaire : même sans commit, le validateur officiel est
  # re-vérifié (détecte une révocation/changement côté KoSIT).
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  kosit-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pytest est la seule dépendance Python nécessaire : le générateur
      # d'échantillons (test_xrechnung.facture_ok) et le service xrechnung
      # n'importent que la stdlib + pytest. Version alignée sur requirements-dev.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer pytest (seule dépendance du générateur d'échantillons)
        run: python -m pip install pytest==9.0.2

      # Le validateur KoSIT est un JAR autonome : JRE 11+ suffit.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le script : téléchargements épinglés (SHA-256 vérifiés), génération
      # depuis NOTRE code, comparaison octet-par-octet aux fixtures dorées,
      # puis verdict officiel. Code de sortie 0 = conforme, sinon échec.
      - name: Valider les XRechnung contre le validateur officiel KoSIT
        run: bash scripts/valider-xrechnung-kosit.sh
