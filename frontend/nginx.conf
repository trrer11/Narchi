# ============================================================================
# NARCHI — NGINX PRODUCTION (durcissement réseau + CSP stricte)
# ----------------------------------------------------------------------------
# Sert la SPA React/Vite et proxyfie le backend FastAPI (service "backend").
# Ce fichier est inclus au niveau http{} (conf.d/default.conf) : les
# directives map/limit_req_zone en tête de fichier sont donc valides.
#
# Hypothèse d'exploitation : en production, TLS terminé en amont
# (reverse-proxy/ingress). En LOCAL DEPUIS §119 : l'étape 4 (optionnelle,
# 8_ACTIVER_HTTPS_LOCAL.bat) fait terminer TLS ICI sur le port 8443 avec un
# certificat mkcert de la machine — le 8080 HTTP mono-poste reste inchangé.
# Les en-têtes HSTS sont émis pour être présents de bout en bout.
# ============================================================================

# --- Négociation WebSocket propre (chat temps réel /api/v5/chat/ws) ---------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# --- Rate limiting : anti brute-force sur l'authentification ----------------
# 10 req/min par IP sur les endpoints de login ; burst court sans délai.
limit_req_zone $binary_remote_addr zone=narchi_auth:10m rate=10r/m;
# Limite générale API : 30 req/s par IP (protège le moteur de calcul).
limit_req_zone $binary_remote_addr zone=narchi_api:10m rate=30r/s;

# Journal d'accès JSON sans query-string, cookie ni corps. Le request_id renvoyé
# par FastAPI permet de relier immédiatement une ligne Nginx à une ligne backend.
log_format narchi_json escape=json '{"timestamp":"$time_iso8601",'
    '"level":"INFO","service":"narchi-frontend","event_code":"NGINX_ACCESS",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","request_id":"$upstream_http_x_narchi_request_id",'
    '"bytes_sent":$bytes_sent}';
access_log /dev/stdout narchi_json;
error_log /dev/stderr warn;

# ============================================================================
# §119 — Bloc serveur unique : tout le contenu vit dans
# narchi-common-locations.inc (copie dans l'image) afin que le port HTTPS 8443
# (template infra/tls/https-8443.conf, active par 8_ACTIVER_HTTPS_LOCAL.bat)
# serve EXACTEMENT la meme chose — jamais deux copies qui divergent.
# ============================================================================
server {
    # Image nginxinc/nginx-unprivileged : processus non-root (UID 101),
    # impossible de binder un port < 1024 → écoute unique sur 8080 (HTTP
    # mono-poste, comportement historique INCHANGE).
    listen 8080;
    server_name _;

    include /etc/nginx/conf.d/narchi-common-locations.inc;
}

# ----------------------------------------------------------------------------
# §119 — HTTPS local (telephone) : le bloc 8443 n'existe QUE si des fichiers
# sont deposes dans /etc/nginx/tls-enabled/ (montage infra/tls/enabled/).
# Un glob sans correspondance n'est PAS une erreur nginx → l'installation
# reste strictement identique tant que l'etape 4 n'a pas ete activee.
# ----------------------------------------------------------------------------
include /etc/nginx/tls-enabled/*.conf;
