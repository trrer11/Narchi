# ============================================================================
# §119 — NARCHI HTTPS LOCAL : bloc serveur 8443 (template versionne dans git).
#
# scripts/ACTIVER_HTTPS_LOCAL.ps1 COPIE ce fichier dans infra/tls/enabled/
# (monte dans le conteneur sur /etc/nginx/tls-enabled/, inclus par nginx.conf
# via un glob : absent = inerte). Il ne contient AUCUN secret : les
# certificats reels vivent dans infra/tls/certs/ (gitignore).
#
# Pourquoi 8443 : image nginx non-root (UID 101) — impossible de binder 443.
# Pourquoi ce serveur DELEGGUE tout le contenu a l'include commun : jamais
# deux copies des regles qui pourraient diverger entre 8080 et 8443.
# ============================================================================
server {
    listen 8443 ssl;
    server_name _;

    # Certificats generes par mkcert (machine locale) — voir
    # scripts/ACTIVER_HTTPS_LOCAL.ps1. Chemins = montages docker-compose.
    ssl_certificate     /etc/nginx/tls/narchi-local.pem;
    ssl_certificate_key /etc/nginx/tls/narchi-local-key.pem;

    # TLS modernes uniquement. Pas d'OCSP stapling : la CA est LOCALE
    # (mkcert), elle n'a pas de responder — le desactiver evite un warning
    # nginx parasite au demarrage, c'est tout.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NARCHI_TLS_LOCAL:10m;
    ssl_session_timeout 1d;
    ssl_stapling off;

    # Pas de HTTP/2 volontairement : HTTP/1.1 suffit largement sur un LAN et
    # la directive a change de forme selon les versions nginx — on choisit
    # la configuration lisible partout plutot que la micro-optimisation.
    # (Dit honnetement, pas un oubli.)

    # EXACTEMENT le meme contenu qu'en 8080 (SPA, API, WebSockets, CSP).
    include /etc/nginx/conf.d/narchi-common-locations.inc;
}
